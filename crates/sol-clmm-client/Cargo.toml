[package]
name = "sol-clmm-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thin multi-venue Client API for Solana CLMM/DLMM reads (Orca · Raydium · Meteora)"
readme = "../../README.md"

[features]
default = []
write = [
    "sol-clmm-manager/write",
    "orca-whirlpool/write",
    "raydium-clmm/write",
    "meteora-dlmm/write",
    "dep:solana-keypair",
    "dep:solana-signer",
]

[dependencies]
anyhow = { workspace = true }
solana-client = { workspace = true }
solana-pubkey = { workspace = true }
sol-clmm-manager = { workspace = true }
orca-whirlpool = { workspace = true }
raydium-clmm = { workspace = true }
meteora-dlmm = { workspace = true }
solana-keypair = { workspace = true, optional = true }
solana-signer = { workspace = true, optional = true }
